services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: work-management-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:8000
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_FILE=/app/data/work_management.db
    volumes:
      - ./data:/app/data
    ports:
      - "8001:8000"
    networks:
      - wm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: work-management-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - wm-network

networks:
  wm-network:
    driver: bridge
