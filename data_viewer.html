      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 10px;

      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: #fff;

    .brand-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .brand-sub { font-size: 12px; color: var(--text-muted); }
    .stats-bar {

      background: #0f172a; border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .stat-pill {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 16px; display: flex;
      align-items: center; gap: 10px; min-width: 150px;
    }
    .stat-num { font-size: 18px; font-weight: 700; color: #60a5fa; }
    .stat-lbl { font-size: 12px; color: var(--text-muted); }
    .layout {
      display: flex; flex: 1; overflow: hidden;
    }
    .sidebar {

    .table-list {

      align-items: center; font-size: 13px; font-weight: 500;
      color: #cbd5e1; transition: all 0.15s ease;
    }
    .table-item:hover { background: #1e293b; color: #fff; }
    .table-item.active {
      background: #1e3a8a; color: #93c5fd; font-weight: 600;
      border-left: 3px solid var(--primary);
    }
    .table-badge {
      font-size: 11px; padding: 2px 7px; border-radius: 999px;
      background: #1e293b; color: #94a3b8;
    }
    .table-item.active .table-badge {
      background: #2563eb; color: #fff;
    }
    .main {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg);
    }
    .toolbar {
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; background: #101726; flex-wrap: wrap;
    }
    .search-input {
      background: #1e293b; border: 1px solid var(--border-light);
      border-radius: 8px; padding: 8px 14px; font-size: 13px;
      color: #fff; width: 320px; outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .view-modes {
      display: flex; gap: 8px; background: #1e293b; padding: 4px; border-radius: 8px;
    }
    .view-btn {
      padding: 6px 14px; font-size: 12px; font-weight: 600;
      border: none; background: transparent; color: var(--text-muted);
      border-radius: 6px; cursor: pointer; transition: all 0.15s ease;
    }
    .view-btn.active {
      background: var(--primary); color: #fff;
    }
    .table-container {
      flex: 1; overflow: auto; padding: 20px 24px;
    }
    table.data-tbl {
      width: 100%; border-collapse: separate; border-spacing: 0;
      border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; font-size: 13px;
    }
    table.data-tbl th {
      background: #131c2e; padding: 12px 14px; text-align: left;
      font-weight: 600; color: #94a3b8; font-size: 12px;
      border-bottom: 1px solid var(--border); position: sticky; top: 0;
      white-space: nowrap;
    }
    table.data-tbl td {
      padding: 10px 14px; border-bottom: 1px solid #1a2234;
      color: #e2e8f0; vertical-align: top; max-width: 320px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    table.data-tbl tr:hover td { background: #141e33; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 600;
    }
    .badge-primary { background: #1e3a8a; color: #93c5fd; }
    .badge-success { background: #064e3b; color: #6ee7b7; }
    .badge-warning { background: #78350f; color: #fde68a; }

      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      background: #1e293b; color: #38bdf8; padding: 2px 6px; border-radius: 4px;
    }
    .json-box {
      background: #0f172a; border: 1px solid var(--border);
      border-radius: 10px; padding: 18px; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: #38bdf8; line-height: 1.6;
      max-height: 600px; overflow: auto; white-space: pre-wrap;
    }

      padding: 6px 12px; background: #1e293b; border: 1px solid var(--border-light);

      display: inline-flex; align-items: center; gap: 6px;
    }

    let currentTable = 'users';
    let currentView = 'table';
    let searchQuery = '';

    function init() {
      renderStats();
      renderTableList();
      loadTable('users');
    }

    function renderStats() {
      const stats = [
        { label: 'Tổng số bảng', val: Object.keys(dbData).length, icon: '🗄️' },
        { label: 'Tài khoản người dùng', val: (dbData.users?.total_rows || 0), icon: '👥' },
        { label: 'Ca trực chuẩn', val: (dbData.shift_templates?.total_rows || 0), icon: '⏰' },
        { label: 'Lượt phân ca & trực', val: (dbData.shift_registrations?.total_rows || 0), icon: '📅' },
        { label: 'Dự án & Nhiệm vụ', val: (dbData.tasks?.total_rows || 0), icon: '🚀' },
        { label: 'Đánh giá năng lực', val: (dbData.competency_evaluations?.total_rows || 0), icon: '⭐' }
      ];

      const bar = document.getElementById('statsBar');
      bar.innerHTML = stats.map(s => `
        <div class="stat-pill">
          <span style="font-size: 22px;">${s.icon}</span>
          <div>
            <div class="stat-num">${s.val}</div>
            <div class="stat-lbl">${s.label}</div>
          </div>
        </div>
      `).join('');
    }

    function renderTableList() {
      const list = document.getElementById('tableList');
      const tableNames = Object.keys(dbData).sort((a,b) => {
        // prioritize non-empty tables
        return (dbData[b].total_rows || 0) - (dbData[a].total_rows || 0);
      });

      list.innerHTML = tableNames.map(t => {
        const count = dbData[t].total_rows || 0;
        return `
          <li class="table-item ${t === currentTable ? 'active' : ''}" onclick="loadTable('${t}')">
            <span>${t}</span>
            <span class="table-badge">${count}</span>
          </li>
        `;
      }).join('');
    }

    function loadTable(tableName) {
      currentTable = tableName;
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      renderTableList();
      renderContent();
    }

    function setViewMode(mode) {
      currentView = mode;
      document.getElementById('btnTableView').className = 'view-btn ' + (mode === 'table' ? 'active' : '');
      document.getElementById('btnJsonView').className = 'view-btn ' + (mode === 'json' ? 'active' : '');
      renderContent();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      renderContent();
    }

    function renderContent() {
      const tbl = dbData[currentTable];
      document.getElementById('currentTableTitle').innerText = currentTable;
      document.getElementById('currentTableRowCount').innerText = `(${tbl.total_rows} dòng dữ liệu)`;

      const area = document.getElementById('contentArea');
      const rows = tbl.sample_rows || [];

      if (rows.length === 0) {
        area.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 40px; margin-bottom: 12px;">📭</div>
            <div style="font-size: 16px; font-weight: 600; color: #fff;">Bảng [${currentTable}] hiện chưa có dữ liệu</div>
            <p style="font-size: 13px; margin-top: 6px;">Bảng này được tạo cấu trúc sẵn trong database nhưng chưa có bản ghi nào.</p>
          </div>
        `;
        return;
      }

      // Filter rows by search query
      const filtered = rows.filter(r => {
        if (!searchQuery) return true;
        return Object.values(r).some(v => String(v || '').toLowerCase().includes(searchQuery));
      });

      if (currentView === 'json') {
        const jsonStr = JSON.stringify(filtered.length > 0 ? (filtered.length === 1 ? filtered[0] : filtered) : rows[0], null, 2);
        area.innerHTML = `
          <div style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 13px; color: #94a3b8;">Format JSON mẫu để copy đem vào Postman, Swagger hoặc viết test script:</span>
            <button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('jsonCode').innerText); alert('Đã sao chép format JSON vào Clipboard!');">📋 Copy JSON</button>
          </div>
          <div class="json-box" id="jsonCode">${escapeHtml(jsonStr)}</div>
        `;
        return;
      }

      // Table View
      const columns = Object.keys(rows[0]);
      let html = '<table class="data-tbl"><thead><tr>';
      columns.forEach(c => {
        html += `<th>${c}</th>`;
      });
      html += '</tr></thead><tbody>';

      filtered.forEach(r => {
        html += '<tr>';
        columns.forEach(c => {
          let val = r[c];
          let formatted = formatValue(c, val);
          html += `<td>${formatted}</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      area.innerHTML = html;
    }

    function formatValue(colName, val) {
      if (val === null || val === undefined) return '<span style="color:#64748b; font-style:italic;">null</span>';
      
      const str = String(val);
      // Date or timestamp detection
      if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
        return `<span class="badge-date">${str}</span>`;
      }
      if (colName === 'status' || colName === 'attendance_status') {
        if (str === 'active' || str === 'present' || str === 'FINISHED' || str === 'sent') {
          return `<span class="badge badge-success">${str}</span>`;
        }
        if (str === 'pending' || str === 'registered' || str === 'IN_PROGRESS') {
          return `<span class="badge badge-primary">${str}</span>`;
        }
        return `<span class="badge badge-warning">${str}</span>`;
      }
      if (colName === 'role') {
        return `<span class="badge badge-primary">${str}</span>`;
      }
      if (colName.includes('password_hash')) {
        return `<span style="font-family: monospace; font-size: 11px; color:#64748b;">${str.substring(0, 12)}...</span>`;
      }
      if (colName.includes('body') || colName.includes('scores_json')) {
        return `<span style="font-family: monospace; font-size: 11px; color:#94a3b8;" title="${escapeHtml(str)}">${escapeHtml(str.substring(0, 45))}...</span>`;
      }
      return escapeHtml(str);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function exportCurrentTableJson() {
      const tbl = dbData[currentTable];
      const blob = new Blob([JSON.stringify(tbl.sample_rows, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${currentTable}_data.json`;
      a.click();
    }

    window.onload = init;
  </script>
